name: Build and release
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Build all platforms and architectures, or publish an already successful build
        required: true
        default: build
        type: choice
        options:
        - build
        - publish
      build_run_id:
        description: 'Publish only: successful combined build run ID'
        required: false
        type: string
      tag:
        description: 'Publish only: new release tag (for example v1.0.0)'
        required: false
        type: string
      release_description:
        description: 'Publish only: release description (Markdown)'
        required: false
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    name: Linux AppImage (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-22.04
        - arch: aarch64
          runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: System libraries
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev \
          libfontconfig1-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
          libfuse2 file desktop-file-utils zsync build-essential cmake git flex bison
    - name: Native tools for ARM
      if: matrix.arch == 'aarch64'
      run: |
        bash scripts/install_thtk.sh --update --yes
        bash scripts/install_pc98_music.sh --force
    - name: Unit tests
      run: cargo test --release --locked
    - name: Build AppImage
      env:
        ARCH: ${{ matrix.arch }}
      run: bash packaging/appimage/build_appimage.sh
    - name: Report size
      env:
        ARCH: ${{ matrix.arch }}
      run: du -h "dist/Mukyu_Launcher-$ARCH.AppImage" "dist/Mukyu_Launcher-$ARCH.AppImage.zsync" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      with:
        name: Linux-AppImage-${{ matrix.arch }}
        path: |
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage.zsync
          dist/VERSION
        compression-level: 0
        if-no-files-found: error

  linux-32:
    name: Linux AppImage (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: i686
        - arch: armhf
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - name: Build AppImage in a 32-bit container
      if: matrix.arch == 'i686'
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        docker run --rm --platform linux/386 -v "$PWD:/src" -w /src -e ARCH -e GITHUB_REPOSITORY -e CARGO_TERM_COLOR i386/debian:bookworm linux32 bash -euo pipefail -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git file xz-utils zsync \
            build-essential cmake flex bison pkg-config desktop-file-utils libasound2-dev libxkbcommon-dev \
            libfontconfig1-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          git config --global --add safe.directory /src
          bash scripts/install_thtk.sh --update --yes
          bash scripts/install_pc98_music.sh --force
          cargo test --release --locked
          LIBC=gnu bash packaging/appimage/build_appimage.sh
          chown -R '"$(id -u):$(id -g)"' dist
        '
    - uses: docker/setup-qemu-action@v3
      if: matrix.arch == 'armhf'
      with:
        platforms: arm
    - uses: dtolnay/rust-toolchain@stable
      if: matrix.arch == 'armhf'
      with:
        targets: armv7-unknown-linux-gnueabihf
    - name: armhf cross toolchain and libraries
      if: matrix.arch == 'armhf'
      run: |
        sudo dpkg --add-architecture armhf
        sudo sed -i -E 's/^deb (https?:)/deb [arch=amd64] \1/' /etc/apt/sources.list
        for suite in jammy jammy-updates jammy-security; do
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse"
        done | sudo tee /etc/apt/sources.list.d/armhf.list
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          file zsync desktop-file-utils cmake flex bison pkg-config \
          libasound2-dev:armhf libxkbcommon-dev:armhf libfontconfig1-dev:armhf libwayland-dev:armhf \
          libxcursor-dev:armhf libxrandr-dev:armhf libxi-dev:armhf libgl1-mesa-dev:armhf
    - name: Cross-compile AppImage
      if: matrix.arch == 'armhf'
      env:
        ARCH: armhf
        CARGO_BUILD_TARGET: armv7-unknown-linux-gnueabihf
        CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
        CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
        PKG_CONFIG_ALLOW_CROSS: '1'
        PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
      run: |
        CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ bash scripts/install_thtk.sh --update --yes
        CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ bash scripts/install_pc98_music.sh --force
        cargo test --release --locked
        LIBC=gnu bash packaging/appimage/build_appimage.sh
    - name: Report size
      env:
        ARCH: ${{ matrix.arch }}
      run: du -h "dist/Mukyu_Launcher-$ARCH.AppImage" "dist/Mukyu_Launcher-$ARCH.AppImage.zsync" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      with:
        name: Linux-AppImage-${{ matrix.arch }}
        path: |
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage.zsync
          dist/VERSION
        compression-level: 0
        if-no-files-found: error

  linux-musl:
    name: Linux musl AppImage (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-22.04
          image: rust:1-alpine
          platform: linux/amd64
        - arch: aarch64
          runner: ubuntu-22.04-arm
          image: rust:1-alpine
          platform: linux/arm64
        - arch: i686
          runner: ubuntu-22.04
          image: alpine:latest
          platform: linux/386
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - name: Build in Alpine
      env:
        ARCH: ${{ matrix.arch }}
        IMAGE: ${{ matrix.image }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        docker run --rm --platform "$PLATFORM" -v "$PWD:/src" -w /src -e ARCH -e GITHUB_REPOSITORY -e CARGO_TERM_COLOR "$IMAGE" sh -euc '
          command -v cargo >/dev/null || apk add --no-cache rust cargo
          apk add --no-cache bash curl git file cmake make build-base flex bison pkgconf musl-dev \
            alsa-lib-dev libxkbcommon-dev fontconfig-dev wayland-dev libxcursor-dev libxrandr-dev libxi-dev mesa-dev \
            desktop-file-utils
          git config --global --add safe.directory /src
          bash scripts/install_thtk.sh --update --yes
          bash scripts/install_pc98_music.sh --force
          cargo test --release --locked
          LIBC=musl MUKYU_ALLOW_NO_ZSYNC=1 bash packaging/appimage/build_appimage.sh
          chown -R '"$(id -u):$(id -g)"' dist
        '
    - name: Delta update file
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends zsync
        cd dist
        zsyncmake -u "Mukyu_Launcher-$ARCH-musl.AppImage" "Mukyu_Launcher-$ARCH-musl.AppImage"
        grep -a -q "^Filename: Mukyu_Launcher-$ARCH-musl.AppImage$" "Mukyu_Launcher-$ARCH-musl.AppImage.zsync"
    - name: Report size
      env:
        ARCH: ${{ matrix.arch }}
      run: du -h "dist/Mukyu_Launcher-$ARCH-musl.AppImage" "dist/Mukyu_Launcher-$ARCH-musl.AppImage.zsync" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      with:
        name: Linux-AppImage-${{ matrix.arch }}-musl
        path: |
          dist/Mukyu_Launcher-${{ matrix.arch }}-musl.AppImage
          dist/Mukyu_Launcher-${{ matrix.arch }}-musl.AppImage.zsync
          dist/VERSION
        compression-level: 0
        if-no-files-found: error

  windows-tools:
    name: Windows native tools (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-latest
          msystem: UCRT64
          cc: gcc
          cxx: g++
          packages: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-zlib
        - arch: arm64
          runner: windows-11-arm
          msystem: CLANGARM64
          cc: clang
          cxx: clang++
          packages: mingw-w64-clang-aarch64-python mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-zlib
        - arch: x86
          runner: windows-latest
          msystem: UCRT64
          cc: i686-w64-mingw32-clang
          cxx: i686-w64-mingw32-clang++
          packages: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja unzip
          llvm_mingw: llvm-mingw-20261104-ucrt-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Keep LF line endings
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: 'false'
        install: git make flex bison ${{ matrix.packages }}
    - name: llvm-mingw
      if: matrix.llvm_mingw
      env:
        LLVM_MINGW: ${{ matrix.llvm_mingw }}
      run: |
        curl -fsSL --retry 3 -o /tmp/llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.zip"
        echo "552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f  /tmp/llvm-mingw.zip" | sha256sum -c
        unzip -q /tmp/llvm-mingw.zip -d /opt
        rm /tmp/llvm-mingw.zip
    - name: Build
      env:
        LLVM_MINGW: ${{ matrix.llvm_mingw }}
      run: |
        if [ -n "$LLVM_MINGW" ]; then export PATH="/opt/$LLVM_MINGW/bin:$PATH"; fi
        bash ./packaging/windows/build_tools_msys2.sh all
    - uses: actions/upload-artifact@v6
      with:
        name: win-tools-${{ matrix.arch }}
        path: |
          tools/thtk/bin/thdat.exe
          tools/pc98/bin/pmd_render.exe
          tools/pc98/bin/mdt_render.exe
          tools/pc98/BUILD_INFO.txt
          tools/thtk/REVISION
          tools/licenses
        if-no-files-found: error

  windows-app:
    name: Windows app (${{ matrix.arch }})
    needs: windows-tools
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-latest
        - arch: arm64
          runner: windows-11-arm
        - arch: x86
          runner: windows-latest
          target: i686-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
    - name: Build
      shell: pwsh
      env:
        TARGET: ${{ matrix.target }}
      run: |
        if ($env:TARGET) {
          cargo build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "target\$env:TARGET\release\mukyulauncher.exe" target\release\mukyulauncher.exe
        } else {
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
        }
    - name: Check runtime dependencies
      shell: pwsh
      run: |
        $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target\release\mukyulauncher.exe"))
        foreach ($dll in @("VCRUNTIME140", "MSVCP140", "api-ms-win-crt-")) {
          if ($text.IndexOf($dll, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "MukyuLauncher.exe still depends on $dll" }
        }
    - name: PDFium
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
      run: bash scripts/fetch_pdfium.sh windows build/pdfium "$ARCH"
    - uses: actions/download-artifact@v7
      with:
        name: win-tools-${{ matrix.arch }}
        path: win-tools
    - name: Stage
      shell: pwsh
      run: ./packaging/windows/stage.ps1 -Tools win-tools
    - name: Smoke test
      shell: pwsh
      run: |
        $env:MUKYU_ROOT = "$PWD\build\stage"
        & "$PWD\build\stage\MukyuLauncher.exe" --bgm-report | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
    - uses: actions/upload-artifact@v6
      with:
        name: win-stage-${{ matrix.arch }}
        path: build/stage
        if-no-files-found: error

  windows-installer:
    name: Windows installers
    needs: windows-app
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v7
      with:
        name: win-stage-x64
        path: build/stage-x64
    - uses: actions/download-artifact@v7
      with:
        name: win-stage-arm64
        path: build/stage-arm64
    - uses: actions/download-artifact@v7
      with:
        name: win-stage-x86
        path: build/stage-x86
    - name: Build installers
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress | Out-Null
        $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
        foreach ($arch in @("x64", "arm64", "x86")) {
          Copy-Item "${env:ProgramFiles(x86)}\Inno Setup 6\License.txt" "build\stage-$arch\tools\licenses\Inno-Setup-LICENSE.txt"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DArch=$arch" "/DStage=..\..\build\stage-$arch" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
        }
    - uses: actions/upload-artifact@v6
      with:
        name: Windows-Installer
        path: |
          dist/Mukyu_Launcher_Setup.exe
          dist/Mukyu_Launcher_Setup_arm64.exe
          dist/Mukyu_Launcher_Setup_x86.exe
        compression-level: 0
        if-no-files-found: error

  publish:
    name: Publish verified build
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Validate inputs
      env:
        RUN_ID: ${{ inputs.build_run_id }}
        TAG: ${{ inputs.tag }}
      run: |
        [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Enter the successful build run ID."; exit 1; }
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "Use a tag such as v1.0.0"; exit 1; }
    - uses: actions/download-artifact@v7
      with:
        pattern: Linux-AppImage-*
        merge-multiple: true
        path: release
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v7
      with:
        name: Windows-Installer
        path: release
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}
    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        RELEASE_DESCRIPTION: ${{ inputs.release_description }}
      run: |
        files=(
          release/Mukyu_Launcher-x86_64.AppImage
          release/Mukyu_Launcher-x86_64.AppImage.zsync
          release/Mukyu_Launcher-aarch64.AppImage
          release/Mukyu_Launcher-aarch64.AppImage.zsync
          release/Mukyu_Launcher-x86_64-musl.AppImage
          release/Mukyu_Launcher-x86_64-musl.AppImage.zsync
          release/Mukyu_Launcher-aarch64-musl.AppImage
          release/Mukyu_Launcher-aarch64-musl.AppImage.zsync
          release/Mukyu_Launcher-i686-musl.AppImage
          release/Mukyu_Launcher-i686-musl.AppImage.zsync
          release/Mukyu_Launcher-i686.AppImage
          release/Mukyu_Launcher-i686.AppImage.zsync
          release/Mukyu_Launcher-armhf.AppImage
          release/Mukyu_Launcher-armhf.AppImage.zsync
          release/Mukyu_Launcher_Setup.exe
          release/Mukyu_Launcher_Setup_arm64.exe
          release/Mukyu_Launcher_Setup_x86.exe
        )
        for f in "${files[@]}"; do test -s "$f" || { echo "Missing $f"; exit 1; }; done
        built="$(tr -d '[:space:]' < release/VERSION)"
        if [[ "v$built" != "$TAG" ]]; then
          echo "The tag $TAG does not match the built version $built (Cargo.toml). Bump the version, rebuild, then publish."
          exit 1
        fi
        {
          if [[ -n "$RELEASE_DESCRIPTION" ]]; then
            printf '%s\n' "$RELEASE_DESCRIPTION"
          else
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body
          fi
          printf '\n'
          bash scripts/release_notes.sh "$TAG" "$GH_REPO"
        } > release-notes.md
        gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --draft -F release-notes.md
        gh release upload "$TAG" "${files[@]}"
        gh release edit "$TAG" --draft=false
    - name: Refresh README badges
      continue-on-error: true
      env:
        GH_REPO: ${{ github.repository }}
      run: |
        sleep 10
        curl -fsSL "https://github.com/$GH_REPO" \
          | grep -oE 'https://camo\.githubusercontent\.com/[0-9a-f]+/[0-9a-f]+' \
          | sort -u \
          | while read -r url; do curl -s -o /dev/null -X PURGE "$url" || true; done
