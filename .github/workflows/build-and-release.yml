name: Build and release
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Build all platforms and architectures, or publish an already successful build
        required: true
        default: build
        type: choice
        options:
        - build
        - publish
      build_run_id:
        description: 'Publish only: successful combined build run ID'
        required: false
        type: string
      tag:
        description: 'Publish only: new release tag (for example v1.0.0)'
        required: false
        type: string
      release_description:
        description: 'Publish only: release description (Markdown)'
        required: false
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    name: Linux AppImage (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-22.04
        - arch: aarch64
          runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: System libraries
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev \
          libfontconfig1-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
          libfuse2 file desktop-file-utils zsync build-essential cmake git flex bison
    - name: Native tools for ARM
      if: matrix.arch == 'aarch64'
      run: |
        bash scripts/install_thtk.sh --update --yes
        bash scripts/install_pc98_music.sh --force
    - name: Unit tests
      run: cargo test --release --locked
    - name: Build AppImage
      env:
        ARCH: ${{ matrix.arch }}
      run: bash packaging/appimage/build_appimage.sh
    - name: Report size
      env:
        ARCH: ${{ matrix.arch }}
      run: du -h "dist/Mukyu_Launcher-$ARCH.AppImage" "dist/Mukyu_Launcher-$ARCH.AppImage.zsync" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      with:
        name: Linux-AppImage-${{ matrix.arch }}
        path: |
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage
          dist/Mukyu_Launcher-${{ matrix.arch }}.AppImage.zsync
          dist/VERSION
        compression-level: 0
        if-no-files-found: error

  windows-tools:
    name: Windows native tools (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-latest
          msystem: UCRT64
          cc: gcc
          cxx: g++
          packages: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-zlib
        - arch: arm64
          runner: windows-11-arm
          msystem: CLANGARM64
          cc: clang
          cxx: clang++
          packages: mingw-w64-clang-aarch64-python mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-zlib
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Keep LF line endings
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: 'false'
        install: git make flex bison ${{ matrix.packages }}
    - run: bash ./packaging/windows/build_tools_msys2.sh all
    - uses: actions/upload-artifact@v6
      with:
        name: win-tools-${{ matrix.arch }}
        path: |
          tools/thtk/bin/thdat.exe
          tools/pc98/bin/pmd_render.exe
          tools/pc98/bin/mdt_render.exe
          tools/pc98/BUILD_INFO.txt
          tools/thtk/REVISION
          tools/licenses
        if-no-files-found: error

  windows-app:
    name: Windows app (${{ matrix.arch }})
    needs: windows-tools
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-latest
        - arch: arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release --locked
    - name: Check runtime dependencies
      shell: pwsh
      run: |
        $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target\release\mukyulauncher.exe"))
        foreach ($dll in @("VCRUNTIME140", "MSVCP140", "api-ms-win-crt-")) {
          if ($text.IndexOf($dll, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "MukyuLauncher.exe still depends on $dll" }
        }
    - name: PDFium
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
      run: bash scripts/fetch_pdfium.sh windows build/pdfium "$ARCH"
    - uses: actions/download-artifact@v7
      with:
        name: win-tools-${{ matrix.arch }}
        path: win-tools
    - name: Stage
      shell: pwsh
      run: ./packaging/windows/stage.ps1 -Tools win-tools
    - name: Smoke test
      shell: pwsh
      run: |
        $env:MUKYU_ROOT = "$PWD\build\stage"
        & "$PWD\build\stage\MukyuLauncher.exe" --bgm-report | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
    - uses: actions/upload-artifact@v6
      with:
        name: win-stage-${{ matrix.arch }}
        path: build/stage
        if-no-files-found: error

  windows-installer:
    name: Windows installers
    needs: windows-app
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v7
      with:
        name: win-stage-x64
        path: build/stage-x64
    - uses: actions/download-artifact@v7
      with:
        name: win-stage-arm64
        path: build/stage-arm64
    - name: Build installers
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress | Out-Null
        $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
        foreach ($arch in @("x64", "arm64")) {
          Copy-Item "${env:ProgramFiles(x86)}\Inno Setup 6\License.txt" "build\stage-$arch\tools\licenses\Inno-Setup-LICENSE.txt"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DArch=$arch" "/DStage=..\..\build\stage-$arch" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
        }
    - uses: actions/upload-artifact@v6
      with:
        name: Windows-Installer
        path: |
          dist/Mukyu_Launcher_Setup.exe
          dist/Mukyu_Launcher_Setup_arm64.exe
        compression-level: 0
        if-no-files-found: error

  publish:
    name: Publish verified build
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - name: Validate inputs
      env:
        RUN_ID: ${{ inputs.build_run_id }}
        TAG: ${{ inputs.tag }}
      run: |
        [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Enter the successful build run ID."; exit 1; }
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "Use a tag such as v1.0.0"; exit 1; }
    - uses: actions/download-artifact@v7
      with:
        pattern: Linux-AppImage-*
        merge-multiple: true
        path: release
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v7
      with:
        name: Windows-Installer
        path: release
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}
    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        RELEASE_DESCRIPTION: ${{ inputs.release_description }}
      run: |
        files=(
          release/Mukyu_Launcher-x86_64.AppImage
          release/Mukyu_Launcher-x86_64.AppImage.zsync
          release/Mukyu_Launcher-aarch64.AppImage
          release/Mukyu_Launcher-aarch64.AppImage.zsync
          release/Mukyu_Launcher_Setup.exe
          release/Mukyu_Launcher_Setup_arm64.exe
        )
        for f in "${files[@]}"; do test -s "$f" || { echo "Missing $f"; exit 1; }; done
        built="$(tr -d '[:space:]' < release/VERSION)"
        if [[ "v$built" != "$TAG" ]]; then
          echo "The tag $TAG does not match the built version $built (Cargo.toml). Bump the version, rebuild, then publish."
          exit 1
        fi
        notes=(--generate-notes)
        if [[ -n "$RELEASE_DESCRIPTION" ]]; then
          notes=(--notes "$RELEASE_DESCRIPTION")
        fi
        gh release create "$TAG" --title "$TAG" --draft "${notes[@]}"
        gh release upload "$TAG" "${files[@]}"
        gh release edit "$TAG" --draft=false
    - name: Refresh README badges
      continue-on-error: true
      env:
        GH_REPO: ${{ github.repository }}
      run: |
        sleep 10
        curl -fsSL "https://github.com/$GH_REPO" \
          | grep -oE 'https://camo\.githubusercontent\.com/[0-9a-f]+/[0-9a-f]+' \
          | sort -u \
          | while read -r url; do curl -s -o /dev/null -X PURGE "$url" || true; done
