name: Build and release
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Build both platforms, or publish an already successful build
        required: true
        default: build
        type: choice
        options:
        - build
        - publish
      build_run_id:
        description: 'Publish only: successful combined build run ID'
        required: false
        type: string
      tag:
        description: 'Publish only: new release tag (for example v1.2.3)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  linux-sources:
    name: Linux source check
    if: inputs.operation == 'build'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Verify matching Linux dependency sources
      run: python3 packaging/licenses/repository_sources.py verify --platform linux
  windows-tools:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Keep LF line endings (the runner defaults to CRLF, which breaks bash scripts)
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: 'false'
        suppress-deprecation-warnings: msystem-mingw64
        install: git make flex bison mingw-w64-x86_64-python mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib
    - run: bash ./packaging/windows/build_tools_msys2.sh all
    - uses: actions/upload-artifact@v7
      with:
        name: win-tools
        path: |
          tools/thtk/bin/thdat.exe
          tools/pc98/bin/pmd_render.exe
          tools/pc98/bin/mdt_render.exe
          tools/pc98/BUILD_INFO.txt
          tools/thtk/REVISION
          tools/licenses
        if-no-files-found: error
    name: Windows native tools
    if: inputs.operation == 'build'
  windows-installer:
    needs:
    - windows-tools
    runs-on: windows-latest
    steps:
    - name: Keep LF line endings (the runner defaults to CRLF, which breaks bash scripts)
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      id: msys
      with:
        msystem: MINGW64
        update: 'false'
        suppress-deprecation-warnings: msystem-mingw64
    - name: Download pinned runtime packages
      shell: pwsh
      run: |-
        python packaging/licenses/repository_sources.py fetch --platform windows --output build/runtime-packages
        if ($LASTEXITCODE -ne 0) { throw "Pinned runtime download or source verification failed" }
    - name: Install pinned runtime packages
      shell: msys2 {0}
      run: |-
        pacman --noconfirm -U build/runtime-packages/*.pkg.tar.zst
        python packaging/licenses/repository_sources.py check-windows --database "$(cygpath -m /var/lib/pacman/local)"
    - name: Install PDF runtime
      shell: msys2 {0}
      run: |-
        python -m pip install --only-binary=:all: --platform win_amd64 --no-deps --no-compile \
          --target "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" pypdfium2==5.14.0
    - uses: actions/download-artifact@v8
      with:
        name: win-tools
        path: win-tools
    - name: Stage files
      shell: pwsh
      run: |
        $mingw = Join-Path "${{ steps.msys.outputs.msys2-location }}" "mingw64"
        $stage = "build\stage"
        New-Item -ItemType Directory -Force "$stage\runtime", "$stage\app" | Out-Null
        robocopy $mingw "$stage\runtime" /E /NFL /NDL /NJH /NJS /NP `
          /XD include man info locale gtk-doc cmake pkgconfig aclocal `
              "$mingw\share\man" "$mingw\share\locale" "$mingw\share\info" `
              "$mingw\share\gtk-doc" "$mingw\share\bash-completion" "$mingw\share\vala" `
          /XF *.a *.la *.h *.pdb | Out-Null
        $global:LASTEXITCODE = 0
        Copy-Item "$stage\runtime\bin\pythonw.exe" "$stage\runtime\bin\MukyuLauncher.exe"
        Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
        .\rcedit.exe "$stage\runtime\bin\MukyuLauncher.exe" --set-icon packaging\windows\icon.ico `
          --set-version-string ProductName "Mukyu Launcher" --set-version-string FileDescription "Mukyu Launcher"
        robocopy . "$stage\app" /E /NFL /NDL /NJH /NJS /NP `
          /XD .git .github .agents .aws .codex build dist win-tools third_party __pycache__ appimage `
          /XF rcedit.exe *.AppImage "Mukyu Launcher.bat" thdat pmd_render mdt_render umu-run runtime-x86_64 | Out-Null
        $global:LASTEXITCODE = 0
        Copy-Item win-tools\tools\* -Destination "$stage\app\tools" -Recurse -Force
        New-Item -ItemType Directory -Force "$stage\app\tools\thtk\bin","$stage\app\tools\pc98\bin" | Out-Null
        Get-ChildItem -Recurse win-tools -Filter thdat.exe      | Copy-Item -Destination "$stage\app\tools\thtk\bin" -Force
        Get-ChildItem -Recurse win-tools -Filter pmd_render.exe | Copy-Item -Destination "$stage\app\tools\pc98\bin" -Force
        Get-ChildItem -Recurse win-tools -Filter mdt_render.exe | Copy-Item -Destination "$stage\app\tools\pc98\bin" -Force
        New-Item -ItemType Directory -Force "$stage\app\assets\icons\hicolor\256x256\apps" | Out-Null
        Copy-Item assets\icons\hicolor\scalable\apps\mukyulauncher.png "$stage\app\assets\icons\hicolor\256x256\apps\mukyulauncher.png"
        if (Test-Path "$stage\app\third_party") { throw "Dependency sources must not be packaged" }
    - name: Build Windows media integration
      shell: pwsh
      run: ./packaging/windows/build_smtc.ps1 -OutputDirectory build/stage/app/tools/windows
    - name: Smoke test (GTK 4, GStreamer and PDF rendering)
      shell: pwsh
      run: |
        $env:PATH = "$PWD\build\stage\runtime\bin;C:\Windows\System32;C:\Windows"
        & "$PWD\build\stage\runtime\bin\python.exe" -c "import sys; sys.path.insert(0, 'build/stage/app'); import pypdfium2; pdf = pypdfium2.PdfDocument.new(); page = pdf.new_page(72, 72); bitmap = page.render(); assert bitmap.width == 72 and bitmap.height == 72; bitmap.close(); page.close(); pdf.close(); import gi; gi.require_version('Gtk','4.0'); gi.require_version('Gst','1.0'); from gi.repository import Gtk, Gst; Gst.init(None); import mukyu.app, mukyu.pages.games, mukyu.pages.music, mukyu.pages.printworks, mukyu.music.desktop.windows; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'OK')"
        if ($LASTEXITCODE -ne 0) { throw "bundled runtime failed its GTK, GStreamer or PDF smoke test" }
    - name: Verify Windows media integration
      shell: pwsh
      run: |
        $env:PATH = "$PWD\build\stage\runtime\bin;C:\Windows\System32;C:\Windows"
        & "$PWD\build\stage\runtime\bin\python.exe" build/stage/app/packaging/windows/check_smtc.py
        if ($LASTEXITCODE -ne 0) { throw "Windows media integration verification failed" }
    - name: Build installer
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress | Out-Null
        Copy-Item "${env:ProgramFiles(x86)}\Inno Setup 6\License.txt" "build\stage\app\tools\licenses\Inno-Setup-LICENSE.txt"
        $v = "0.0.${{ github.run_number }}"
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\installer.iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
    - uses: actions/upload-artifact@v7
      with:
        name: Windows-Installer
        path: dist/Mukyu_Launcher_Setup.exe
        if-no-files-found: error
        compression-level: 0
      name: Upload runnable Windows installer
    name: Windows installer
    if: inputs.operation == 'build'
  linux:
    needs:
    - linux-sources
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Build AppImage
      run: sudo -E bash packaging/appimage/build_appimage.sh
    - name: Give the runner user ownership of the build output
      run: sudo chown -R "$(id -u):$(id -g)" dist build
    - name: Install host libraries the smoke test expects on a desktop
      run: sudo apt-get install -y --no-install-recommends libvulkan1 libgl1 libegl1 libgbm1 libdrm2
    - name: Smoke test (imports GTK 4, GStreamer, pypdfium2 from the AppImage)
      run: |
        chmod +x dist/*.AppImage
        dist/Mukyu_Launcher-x86_64.AppImage --appimage-extract >/dev/null
        cd squashfs-root
        export TL_APPIMAGE=1 PYTHONHOME="$PWD/usr" \
               LD_LIBRARY_PATH="$PWD/usr/lib/x86_64-linux-gnu" \
               GI_TYPELIB_PATH="$PWD/usr/lib/x86_64-linux-gnu/girepository-1.0" \
               PYTHONPATH="$PWD/usr/lib/python3/dist-packages"
        "$PWD/usr/bin/python3" -c "
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path('usr/share/mukyulauncher').resolve()))
        import gi
        gi.require_version('Gtk','4.0'); gi.require_version('Gst','1.0')
        from gi.repository import Gtk, Gst
        import pypdfium2, ssl, _hashlib
        import mukyu.app, mukyu.pages.games, mukyu.pages.music, mukyu.pages.printworks
        import mukyu.reader.pdf_reader, mukyu.music.desktop.mpris
        from mukyu.paths import ASSETS_DIR, TOOLS_DIR, ICON_PATH
        assert (ASSETS_DIR / 'styles/style.css').is_file()
        assert ICON_PATH.is_file()
        assert not Path('usr/share/mukyulauncher/third_party').exists()
        assert all((TOOLS_DIR / item).is_file() for item in ('thtk/bin/thdat', 'pc98/bin/pmd_render', 'pc98/bin/mdt_render', 'umu/umu-run'))
        print(ssl.OPENSSL_VERSION)
        print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), '| OK')"
    - name: Report AppImage size
      run: |
        python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
        from pathlib import Path
        image = Path("dist/Mukyu_Launcher-x86_64.AppImage")
        if not image.is_file():
            raise SystemExit("The AppImage is missing")
        print(f"AppImage: {image.stat().st_size / 1048576:.1f} MiB")
        PYTHON
    - name: Upload runnable AppImage
      uses: actions/upload-artifact@v7
      with:
        name: Linux-AppImage
        path: dist/Mukyu_Launcher-x86_64.AppImage
        compression-level: 0
        if-no-files-found: error
    name: Linux AppImage
    if: inputs.operation == 'build'
  ready:
    name: Ready to publish
    needs:
    - linux
    - windows-installer
    runs-on: ubuntu-latest
    steps:
    - name: Show release instructions
      env:
        REPO: ${{ github.repository }}
        BUILD_ID: ${{ github.run_id }}
        BUILD_SHA: ${{ github.sha }}
      run: |-
        python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
        import os
        repo = os.environ["REPO"]
        print("## Both builds passed\n")
        print("Download and test the AppImage and Windows installer from this run.\n")
        print(f"When ready, open [Run workflow](https://github.com/{repo}/actions/workflows/build-and-release.yml), select **publish**, and enter:")
        print(f"- Successful build run ID: `{os.environ['BUILD_ID']}`")
        print("- New release tag: your chosen `v1.2.3`-style version")
        print(f"\nThe tag will point to tested commit `{os.environ['BUILD_SHA']}`. Both binaries will be published without rebuilding. Matching dependency sources are in third_party/ at that commit and included in GitHub’s automatic source downloads.")
        print("The installer internal version uses the original build run number; choosing a release tag does not rewrite the tested installer.")
        PYTHON
  publish:
    name: Publish verified build
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: verified-release
      cancel-in-progress: false
    steps:
    - name: Validate successful build and new tag
      id: validate
      uses: actions/github-script@v8
      env:
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        RELEASE_TAG: ${{ inputs.tag }}
      with:
        script: |-
          const runId = process.env.BUILD_RUN_ID.trim();
          const tag = process.env.RELEASE_TAG.trim();
          if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('Enter the successful build run ID.');
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) throw new Error('Use a new tag such as v1.2.3 or v1.2.3-beta.1.');
          require('node:child_process').execFileSync('git', ['check-ref-format', `refs/tags/${tag}`]);
          const repo = context.repo;
          const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: Number(runId)});
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch' || run.path.split('@')[0] !== '.github/workflows/build-and-release.yml' || run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`) throw new Error('Select a successful build from this repository and this combined workflow.');
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100});
          for (const name of ['Linux source check', 'Linux AppImage', 'Windows native tools', 'Windows installer', 'Ready to publish']) {
            if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error(`The selected run has no successful ${name} job.`);
          }
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id: run.id, per_page: 100});
          for (const name of ['Linux-AppImage', 'Windows-Installer']) {
            if (!artifacts.some(artifact => artifact.name === name && !artifact.expired)) throw new Error(`Missing or expired artifact: ${name}`);
          }
          for (const request of [() => github.rest.git.getRef({...repo, ref: `tags/${tag}`}), () => github.rest.repos.getReleaseByTag({...repo, tag})]) {
            try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
            throw new Error('This tag or release already exists. Choose a new tag; existing releases are never overwritten.');
          }
          core.setOutput('run-id', runId);
          core.setOutput('sha', run.head_sha);
          core.setOutput('tag', tag);
    - uses: actions/checkout@v6
      with:
        ref: ${{ steps.validate.outputs.sha }}
    - name: Verify sources in the release commit
      run: |-
        python3 packaging/licenses/repository_sources.py verify --platform linux
        python3 packaging/licenses/repository_sources.py verify --platform windows
    - name: Download Linux-AppImage
      uses: actions/download-artifact@v8
      with:
        name: Linux-AppImage
        path: release
        run-id: ${{ steps.validate.outputs.run-id }}
        github-token: ${{ github.token }}
    - name: Download Windows-Installer
      uses: actions/download-artifact@v8
      with:
        name: Windows-Installer
        path: release
        run-id: ${{ steps.validate.outputs.run-id }}
        github-token: ${{ github.token }}
    - name: Verify complete release assets
      run: |-
        test -s release/Mukyu_Launcher-x86_64.AppImage
        test -s release/Mukyu_Launcher_Setup.exe
    - name: Create draft, upload both builds, then publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        BUILD_SHA: ${{ steps.validate.outputs.sha }}
      run: |-
        gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --title "$RELEASE_TAG" --draft --generate-notes
        gh release upload "$RELEASE_TAG" release/Mukyu_Launcher-x86_64.AppImage release/Mukyu_Launcher_Setup.exe
        gh release edit "$RELEASE_TAG" --draft=false
